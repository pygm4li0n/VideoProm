<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILIMARS · Promo 30s</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Formato vertical 9:16 (feed / story) */
#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: radial-gradient(ellipse at 30% 20%, #0b140b 0%, #020202 55%, #000 100%);
  transform-origin: center center;
}

/* Ambient */
#particles { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
.nebula-1 {
  position: absolute; top: -20%; left: -20%; width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(57,255,20,0.15) 0%, transparent 70%);
  filter: blur(60px); z-index: 0;
  animation: nebulaDrift 20s ease-in-out infinite;
}
.nebula-2 {
  position: absolute; bottom: -20%; right: -20%; width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(117,190,255,0.1) 0%, transparent 70%);
  filter: blur(60px); z-index: 0;
  animation: nebulaDrift 25s ease-in-out infinite reverse;
}
@keyframes nebulaDrift { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.1);} }
.grid-overlay {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(57,255,20,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57,255,20,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
}

/* Scenes */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 120px 80px;
  opacity: 0;
  transform: translateY(30px) scale(0.96);
  transition: opacity 700ms cubic-bezier(.16,1,.3,1), transform 700ms cubic-bezier(.16,1,.3,1);
  pointer-events: none;
  z-index: 10;
}
.scene.active { opacity: 1; transform: translateY(0) scale(1); }
.scene.exit   { opacity: 0; transform: translateY(-30px) scale(0.96); }

/* ─── Scene 0: LOGO ─── */
.logo-hero {
  width: 720px;
  height: auto;
  filter: drop-shadow(0 0 80px rgba(57,255,20,0.55)) drop-shadow(0 20px 40px rgba(0,0,0,0.8));
  animation: logoBreath 6s ease-in-out infinite;
  margin-bottom: 48px;
}
@keyframes logoBreath {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 60px rgba(57,255,20,0.45)) drop-shadow(0 20px 40px rgba(0,0,0,0.8)); }
  50%     { transform: scale(1.03); filter: drop-shadow(0 0 110px rgba(57,255,20,0.7)) drop-shadow(0 20px 40px rgba(0,0,0,0.8)); }
}

/* STREETWEAR: dorado, centrado entre logo y ubicación, con líneas limpias */
.hero-tag-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  margin-bottom: 48px;
}
.hero-tag-wrap .rule {
  display: block;
  width: 130px;
  height: 1.5px;
  background: #FFD700;
  border-radius: 2px;
  box-shadow: 0 0 16px rgba(255,215,0,0.55);
}
.hero-tag {
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: #FFD700;
  text-shadow: 0 0 28px rgba(255,215,0,0.55);
  padding-left: 8px; /* compensa el letter-spacing final */
  white-space: nowrap;
  line-height: 1;
}

.hero-sub {
  margin-top: 0;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #FFFFFF;
  text-align: center;
}
.hero-sub .accent {
  color: #39FF14;
  text-shadow: 0 0 22px rgba(57,255,20,0.55);
}

/* ─── Scene 1: MANIFIESTO (typeado, párrafos) ─── */
.info-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 78px;
  letter-spacing: 3px;
  color: #FFF;
  text-align: center;
  line-height: 0.9;
  margin-bottom: 60px;
}
.info-title span {
  color: #39FF14;
  text-shadow: 0 0 30px rgba(57,255,20,0.55);
}
.manifesto {
  width: 100%;
  max-width: 920px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 36px;
  line-height: 1.5;
  letter-spacing: -0.2px;
  color: #FFFFFF;
  text-align: center;
  min-height: 720px;
  white-space: pre-wrap;
}
.manifesto .accent {
  color: #39FF14;
  text-shadow: 0 0 18px rgba(57,255,20,0.45);
}
/* Hinted words: same font as body, just colored */
.manifesto .play {
  color: #39FF14;
  text-shadow: 0 0 18px rgba(57,255,20,0.45);
}
.manifesto .tail { white-space: nowrap; }
.cursor {
  display: inline-block;
  width: 4px;
  height: 0.95em;
  margin-left: 6px;
  vertical-align: -0.12em;
  background: #39FF14;
  box-shadow: 0 0 18px rgba(57,255,20,0.8);
  animation: blink 900ms steps(1) infinite;
}
@keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

/* ─── Scene 2: CONCEPT → GARMENT ─── */
.concept-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 66px;
  letter-spacing: 2px;
  color: #FFF;
  text-align: center;
  line-height: 0.9;
  margin-bottom: 46px;
  white-space: nowrap;
}
.concept-title span {
  color: #39FF14;
  text-shadow: 0 0 30px rgba(57,255,20,0.55);
}
.concept-stage {
  position: relative;
  width: 860px;
  height: 1100px;
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid rgba(57,255,20,0.25);
  background: #0f0f0f;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(57,255,20,0.1);
}
.concept-img {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 800ms cubic-bezier(.16,1,.3,1), transform 800ms cubic-bezier(.16,1,.3,1);
}
.concept-img.active {
  opacity: 1;
  transform: scale(1);
}
.concept-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Tag grande, centrado, siempre visible */
.concept-tagline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 52px;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 250ms ease, transform 250ms ease;
}
.concept-tagline.swap {
  opacity: 0;
  transform: translateY(10px);
}
.concept-tagline .num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 72px;
  color: #39FF14;
  line-height: 1;
  text-shadow: 0 0 26px rgba(57,255,20,0.6);
}
.concept-tagline .lbl {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 72px;
  letter-spacing: 5px;
  color: #FFFFFF;
  line-height: 1;
  text-shadow: 0 0 18px rgba(255,255,255,0.25);
}

/* ─── Scene 3: CTA ─── */
.cta-logo {
  width: 620px;
  height: auto;
  filter: drop-shadow(0 0 100px rgba(57,255,20,0.6)) drop-shadow(0 20px 40px rgba(0,0,0,0.8));
  margin-bottom: 64px;
  animation: logoBreath 5s ease-in-out infinite;
}
.cta-headline {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 92px;
  line-height: 0.9;
  letter-spacing: 4px;
  color: #FFF;
  text-align: center;
}
.cta-headline span {
  color: #39FF14;
  text-shadow: 0 0 30px rgba(57,255,20,0.55);
}

/* Controls */
#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(0,0,0,0.9);
  border: 1px solid rgba(57,255,20,0.3);
  border-radius: 12px;
  padding: 12px 16px;
  display: none;
  gap: 10px;
  z-index: 100;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 11px;
  color: #B0B0B0;
}
#controls.show { display: flex; }
#controls button {
  background: rgba(57,255,20,0.1);
  border: 1px solid rgba(57,255,20,0.3);
  color: #39FF14;
  padding: 6px 12px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 1px;
}
#controls button:hover { background: rgba(57,255,20,0.2); }
#controls .time { color: #FFF; min-width: 60px; text-align: center; }
</style>
</head>
<body>

<div id="stage">
  <div class="nebula-1"></div>
  <div class="nebula-2"></div>
  <canvas id="particles"></canvas>
  <div class="grid-overlay"></div>

  <!-- SCENE 0 · LOGO REVEAL -->
  <div class="scene" data-scene="0">
    <img class="logo-hero" src="https://i.postimg.cc/0NDfVdP5/Chat-GPT-Image-21-may-2026-01-53-38-(1).png" alt="MILIMARS">
    <div class="hero-tag-wrap">
      <span class="rule"></span>
      <span class="hero-tag">Streetwear</span>
      <span class="rule"></span>
    </div>
    <p class="hero-sub"><span class="accent">VENADO TUERTO</span> · SANTA FE</p>
  </div>

  <!-- SCENE 1 · MANIFIESTO (typeado, párrafos) -->
  <div class="scene" data-scene="1">
    <h2 class="info-title">LO QUE <span>HACEMOS</span></h2>
    <p class="manifesto"><span id="typedText"></span><span class="cursor"></span></p>
  </div>

  <!-- SCENE 2 · CONCEPT → GARMENT -->
  <div class="scene" data-scene="2">
    <h2 class="concept-title">DEL CONCEPTO A LA <span>PRENDA</span></h2>
    <div class="concept-stage">
      <div class="concept-img active" data-i="0">
        <img src="https://i.postimg.cc/W3Fmzq8N/Camiseta-Red-Hot-Chili-Peppers-y-tatuajes.png" alt="Boceto">
      </div>
      <div class="concept-img" data-i="1">
        <img src="https://i.postimg.cc/9MRP0wbF/Cartel-punk-de-Red-Hot-Chili-Peppers.png" alt="Moldería">
      </div>
      <div class="concept-img" data-i="2">
        <img src="https://i.postimg.cc/PJnDq3NV/image-2026-10-21T141707-071.png" alt="Estampa">
      </div>
    </div>
    <div class="concept-tagline" id="conceptTag">
      <span class="num" id="tagNum">01</span>
      <span class="lbl" id="tagLbl">TU IDEA</span>
    </div>
  </div>

  <!-- SCENE 3 · CTA -->
  <div class="scene" data-scene="3">
    <img class="cta-logo" src="https://i.postimg.cc/0NDfVdP5/Chat-GPT-Image-21-may-2026-01-53-38-(1).png" alt="MILIMARS">
    <h2 class="cta-headline">PONETE LA <span>DIFERENCIA</span></h2>
  </div>
</div>

<div id="controls">
  <button id="btnPause">PAUSE</button>
  <button id="btnRestart">RESTART</button>
  <span class="time" id="timeDisplay">0.00s</span>
</div>

<script>
(function() {
  'use strict';

  const TOTAL_MS = 30000;
  // 0: logo       0-4000
  // 1: manifiesto 4000-14000  (typeado)
  // 2: concepto   14000-21500 (3 imágenes × 2.5s)
  // 3: cta        21500-30000
  const BOUNDARIES = [0, 4000, 14000, 21500, 30000];

  const CONCEPT_START = 14000;
  const CONCEPT_STEP  = 2500;
  const CHAR_MS       = 30;

  // Texto con palabras resaltadas y saltos de párrafo.
  // Solo 2 fonts: DM Sans + Bebas Neue.
  const TOKENS = [
    { t: "Creamos prendas con ", c: "" },
    { t: "diseños propios", c: "accent" },
    { t: ", ", c: "" },
    { t: "identidad fuerte", c: "play" },
    { t: " y ", c: "" },
    { t: "carácter", c: "accent" },
    { t: ".", c: "" },
    { t: "\n\n", c: "" },                    // ← separación de párrafo
    { t: "Propuestas ", c: "" },
    { t: "originales", c: "accent" },
    { t: " inspiradas en la ", c: "" },
    { t: "cultura urbana", c: "play" },
    { t: ", pensadas para quienes buscan algo ", c: "" },
    { t: "diferente", c: "accent" },
    { t: " y ", c: "" },
    { t: "fuera de lo convencional", c: "play" },
    { t: ".", c: "" },
    { t: "\n\n", c: "" },                    // ← separación de párrafo
    { t: "Diseñadas y producidas en ", c: "", tail: true },
    { t: "Venado Tuerto", c: "accent", tail: true },
    { t: ".", c: "", tail: true }
  ];

  // Aplanar a caracteres con clase
  const CHARS = [];
  let TAIL_START = -1;
  TOKENS.forEach(tok => {
    if (tok.tail && TAIL_START === -1) TAIL_START = CHARS.length;
    for (const ch of tok.t) CHARS.push({ ch, cls: tok.c || '' });
  });

  const STEP_TEXT = [
    ['01', 'TU IDEA'],
    ['02', 'DISEÑO'],
    ['03', 'PRENDA']
  ];

  const stage        = document.getElementById('stage');
  const scenes       = Array.from(document.querySelectorAll('.scene'));
  const timeDisplay  = document.getElementById('timeDisplay');
  const controls     = document.getElementById('controls');
  const typedEl      = document.getElementById('typedText');

  const conceptImgs  = Array.from(document.querySelectorAll('.concept-img'));
  const conceptTag   = document.getElementById('conceptTag');
  const tagNum       = document.getElementById('tagNum');
  const tagLbl       = document.getElementById('tagLbl');

  let startTime         = performance.now();
  let pausedAt          = 0;
  let isPaused          = false;
  let currentScene      = -1;
  let currentConceptIdx = -1;
  let typedCount        = -1;
  let tagTimer          = null;

  function fitStage() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / 1080, vh / 1920);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function setScene(idx) {
    if (idx === currentScene) return;
    currentScene = idx;

    scenes.forEach((s, i) => {
      s.classList.remove('active', 'exit');
      if (i === idx) s.classList.add('active');
      else if (i < idx) s.classList.add('exit');
    });

    if (idx === 2) currentConceptIdx = -1;
  }

  function setConcept(idx) {
    if (idx === currentConceptIdx) return;
    currentConceptIdx = idx;
    conceptImgs.forEach((el, i) => el.classList.toggle('active', i === idx));

    clearTimeout(tagTimer);
    conceptTag.classList.add('swap');
    tagTimer = setTimeout(() => {
      tagNum.textContent = STEP_TEXT[idx][0];
      tagLbl.textContent = STEP_TEXT[idx][1];
      conceptTag.classList.remove('swap');
    }, 180);
  }

  function getSceneIndex(elapsed) {
    for (let i = BOUNDARIES.length - 2; i >= 0; i--) {
      if (elapsed >= BOUNDARIES[i]) return i;
    }
    return 0;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // Agrupa caracteres consecutivos de la misma clase en spans.
  // Los \n se conservan porque el contenedor usa white-space: pre-wrap.
  function groupRange(a, b) {
    let html = '';
    let i = a;
    while (i < b) {
      const cls = CHARS[i].cls;
      let j = i;
      while (j < b && CHARS[j].cls === cls) j++;
      const text = escapeHtml(CHARS.slice(i, j).map(c => c.ch).join(''));
      html += cls ? `<span class="${cls}">${text}</span>` : text;
      i = j;
    }
    return html;
  }

  function buildHTML(n) {
    if (TAIL_START < 0 || n <= TAIL_START) return groupRange(0, n);
    return groupRange(0, TAIL_START) +
           '<span class="tail">' + groupRange(TAIL_START, n) + '</span>';
  }

  function updateTyping(elapsed) {
    const raw = Math.floor((elapsed - BOUNDARIES[1]) / CHAR_MS);
    const n = Math.max(0, Math.min(CHARS.length, raw));
    if (n === typedCount) return;
    typedCount = n;
    typedEl.innerHTML = buildHTML(n);
  }

  function updateConcept(elapsed) {
    let idx = Math.floor((elapsed - CONCEPT_START) / CONCEPT_STEP);
    idx = Math.max(0, Math.min(2, idx));
    setConcept(idx);
  }

  function tick() {
    if (!isPaused) {
      const elapsed = (performance.now() - startTime) % TOTAL_MS;
      const sceneIdx = getSceneIndex(elapsed);
      setScene(sceneIdx);

      if (sceneIdx === 1) updateTyping(elapsed);
      if (sceneIdx === 2) updateConcept(elapsed);

      timeDisplay.textContent = (elapsed / 1000).toFixed(2) + 's';
    }
    requestAnimationFrame(tick);
  }

  function initParticles() {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = 1080 * dpr;
    canvas.height = 1920 * dpr;
    canvas.style.width  = '1080px';
    canvas.style.height = '1920px';
    ctx.scale(dpr, dpr);

    const particles = [];
    for (let i = 0; i < 70; i++) {
      particles.push({
        x: Math.random() * 1080,
        y: Math.random() * 1920,
        r: Math.random() * 1.8 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        o: Math.random() * 0.5 + 0.2
      });
    }

    function draw() {
      ctx.clearRect(0, 0, 1080, 1920);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = 1080;
        if (p.x > 1080) p.x = 0;
        if (p.y < 0) p.y = 1920;
        if (p.y > 1920) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(57, 255, 20, ${p.o})`;
        ctx.shadowColor = 'rgba(57, 255, 20, 0.8)';
        ctx.shadowBlur = 8;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') controls.classList.toggle('show');
  });

  document.getElementById('btnPause').addEventListener('click', () => {
    if (!isPaused) {
      pausedAt = (performance.now() - startTime);
      isPaused = true;
      document.getElementById('btnPause').textContent = 'RESUME';
    } else {
      startTime = performance.now() - pausedAt;
      isPaused = false;
      document.getElementById('btnPause').textContent = 'PAUSE';
    }
  });

  document.getElementById('btnRestart').addEventListener('click', () => {
    currentScene = -1;
    currentConceptIdx = -1;
    typedCount = -1;
    typedEl.innerHTML = '';
    startTime = performance.now();
    pausedAt = 0;
    isPaused = false;
    document.getElementById('btnPause').textContent = 'PAUSE';
    setScene(0);
    setConcept(0);
  });

  initParticles();
  setScene(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
